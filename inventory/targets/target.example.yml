---
# Target contract
target_schema_version: 1
target_id: replace-with-unique-target-id
automation_mode: plan

# Boot provider: virtualbox, manual_iso, or redfish
target_provider: manual_iso

# OpenShift cluster
cluster_name: replace-me
base_dns_domain: example.com
openshift_version: "4.20"
cpu_architecture: x86_64

# Target network
sno_static_network_enabled: true
sno_interface_name: eth0
sno_mac_address: "00:00:00:00:00:00"
sno_ip_address: 192.0.2.50
sno_prefix_length: 24
sno_gateway: 192.0.2.1
sno_dns_servers:
  - 192.0.2.2

# Installation disk
installation_disk_path: /dev/sda
minimum_installation_disk_bytes: 100000000000

# Assisted Installer media
infra_env_name: "{{ cluster_name }}-infra-env"
discovery_image_type: full-iso
discovery_iso_path: "/replace/with/artifacts/{{ target_id }}/discovery.iso"

# Downloaded OpenShift credentials
credentials_directory: "/replace/with/artifacts/{{ target_id }}/credentials"
kubeconfig_path: "{{ credentials_directory }}/kubeconfig"
kubeadmin_password_path: "{{ credentials_directory }}/kubeadmin-password"

# Waiting behavior
host_registration_retries: 120
host_registration_delay: 15
api_access_retries: 120
api_access_delay: 15
wait_for_cluster_convergence: true
require_cluster_convergence: true

# Provider-specific variables belong below this line.
# Do not store passwords or tokens in this file.
target_modification_approved: false

# Used only with target_provider: manual_iso
manual_boot_confirmed: false
