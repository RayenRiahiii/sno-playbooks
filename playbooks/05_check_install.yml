---
- name: Check SNO installation progress without changing it
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Read the Red Hat offline token from the environment
      ansible.builtin.set_fact:
        redhat_offline_token: "{{ lookup('ansible.builtin.env', 'REDHAT_OFFLINE_TOKEN') }}"
      no_log: true

    - name: Require the Red Hat offline token
      ansible.builtin.assert:
        that:
          - redhat_offline_token | length > 0
        fail_msg: Set REDHAT_OFFLINE_TOKEN in WSL before running this playbook.

    - name: Exchange the offline token for a fresh API token
      ansible.builtin.uri:
        url: "{{ redhat_sso_token_url }}"
        method: POST
        body_format: form-urlencoded
        body:
          grant_type: refresh_token
          client_id: cloud-services
          refresh_token: "{{ redhat_offline_token }}"
        return_content: true
        status_code: 200
      register: redhat_auth
      no_log: true

    - name: Save the short-lived API token
      ansible.builtin.set_fact:
        assisted_api_token: "{{ redhat_auth.json.access_token }}"
      no_log: true

    - name: Find the SNO cluster
      ansible.builtin.uri:
        url: "{{ assisted_api_url }}/v2/clusters"
        method: GET
        headers:
          Authorization: "Bearer {{ assisted_api_token }}"
        status_code: 200
        return_content: true
      register: assisted_clusters

    - name: Select the SNO cluster
      ansible.builtin.set_fact:
        matching_clusters: >-
          {{ assisted_clusters.json
             | selectattr('name', 'equalto', cluster_name)
             | list }}

    - name: Require exactly one SNO cluster
      ansible.builtin.assert:
        that:
          - matching_clusters | length == 1
        fail_msg: Expected exactly one Assisted Installer cluster named {{ cluster_name }}.

    - name: Read current cluster details
      ansible.builtin.uri:
        url: "{{ assisted_api_url }}/v2/clusters/{{ matching_clusters[0].id }}"
        method: GET
        headers:
          Authorization: "Bearer {{ assisted_api_token }}"
        status_code: 200
        return_content: true
      register: current_cluster

    - name: Find the cluster infrastructure environment
      ansible.builtin.uri:
        url: >-
          {{ assisted_api_url }}/v2/infra-envs?cluster_id={{ current_cluster.json.id }}
        method: GET
        headers:
          Authorization: "Bearer {{ assisted_api_token }}"
        status_code: 200
        return_content: true
      register: assisted_infra_envs

    - name: Select the cluster infrastructure environment
      ansible.builtin.set_fact:
        matching_infra_envs: >-
          {{ assisted_infra_envs.json
             | selectattr('name', 'equalto', infra_env_name)
             | list }}

    - name: Require exactly one infrastructure environment
      ansible.builtin.assert:
        that:
          - matching_infra_envs | length == 1
        fail_msg: Expected exactly one InfraEnv named {{ infra_env_name }}.

    - name: Read the SNO host
      ansible.builtin.uri:
        url: >-
          {{ assisted_api_url }}/v2/infra-envs/{{ matching_infra_envs[0].id }}/hosts
        method: GET
        headers:
          Authorization: "Bearer {{ assisted_api_token }}"
        status_code: 200
        return_content: true
      register: discovered_hosts

    - name: Require exactly one SNO host
      ansible.builtin.assert:
        that:
          - discovered_hosts.json | length == 1
        fail_msg: Expected exactly one discovered SNO host.

    - name: Report current installation progress
      ansible.builtin.debug:
        msg:
          - "Cluster status: {{ current_cluster.json.status }}"
          - "Cluster info: {{ current_cluster.json.status_info | default('not reported') }}"
          - "Host status: {{ discovered_hosts.json[0].status }}"
          - >-
            Host stage: {{ discovered_hosts.json[0].progress.current_stage
            | default('not reported') }}
          - >-
            Stage progress: {{ discovered_hosts.json[0].progress.stage_percentage
            | default('not reported') }}%
          - >-
            Installation progress: {{ discovered_hosts.json[0].progress.installation_percentage
            | default('not reported') }}%

    - name: Read Assisted Installer cluster events
      ansible.builtin.uri:
        url: "{{ assisted_api_url }}/v2/events?cluster_id={{ current_cluster.json.id }}"
        method: GET
        headers:
          Authorization: "Bearer {{ assisted_api_token }}"
        status_code: 200
        return_content: true
      register: assisted_events

    - name: Report the latest Assisted Installer events
      ansible.builtin.debug:
        msg: >-
          {{ item.event_time }} [{{ item.severity }}] {{ item.message }}
      loop: "{{ assisted_events.json[-20:] }}"
      loop_control:
        label: "{{ item.event_time }}"

    - name: Report successful completion
      ansible.builtin.debug:
        msg: >-
          OpenShift installation is complete. The next step is to download the
          kubeconfig and kubeadmin credentials.
      when: current_cluster.json.status == 'installed'

    - name: Report installation failure
      ansible.builtin.fail:
        msg: >-
          Installation stopped with status {{ current_cluster.json.status }}:
          {{ current_cluster.json.status_info | default('no details reported') }}
      when: current_cluster.json.status in ['error', 'cancelled']

    - name: Confirm that this check was read-only
      ansible.builtin.debug:
        msg: No installation setting or disk was changed by this status check.
