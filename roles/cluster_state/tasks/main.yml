---
- name: Read Assisted Installer clusters
  ansible.builtin.uri:
    url: "{{ assisted_api_url }}/v2/clusters"
    method: GET
    headers:
      Authorization: "Bearer {{ assisted_api_token }}"
    status_code: 200
    return_content: true
  register: assisted_clusters_response
  no_log: true

- name: Select clusters with the requested name
  ansible.builtin.set_fact:
    matching_sno_clusters: >-
      {{
        assisted_clusters_response.json
        | selectattr('name', 'equalto', cluster_name)
        | list
      }}
  no_log: true

- name: Refuse ambiguous cluster results
  ansible.builtin.assert:
    that:
      - matching_sno_clusters | length <= 1
    fail_msg: >-
      More than one Assisted Installer cluster is named {{ cluster_name }}.
      Resolve the duplicates before continuing.
    quiet: true

- name: Store the absent cluster state
  ansible.builtin.set_fact:
    sno_cluster_exists: false
    sno_cluster_id: ""
    sno_cluster_status: absent
    sno_cluster_status_info: Cluster has not been created.
  when: matching_sno_clusters | length == 0

- name: Store the existing cluster state
  ansible.builtin.set_fact:
    sno_cluster_exists: true
    sno_cluster_id: "{{ matching_sno_clusters[0].id }}"
    sno_cluster_status: "{{ matching_sno_clusters[0].status }}"
    sno_cluster_status_info: >-
      {{
        matching_sno_clusters[0].status_info
        | default('No additional status information')
      }}
  when: matching_sno_clusters | length == 1

- name: Report the cluster state
  ansible.builtin.debug:
    msg:
      - "Cluster exists: {{ sno_cluster_exists }}"
      - >-
        Cluster ID:
        {{ sno_cluster_id if sno_cluster_exists else 'not created' }}
      - "Cluster status: {{ sno_cluster_status }}"
      - "Status information: {{ sno_cluster_status_info }}"
      - This role performed only read operations.
