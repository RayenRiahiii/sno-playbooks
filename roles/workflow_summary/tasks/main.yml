---
- name: Initialize the workflow summary
  ansible.builtin.set_fact:
    sno_summary_stage: "{{ sno_workflow_action }}"
    sno_summary_next_action: >-
      Review the reported state and continue with the selected workflow action.

- name: Summarize an absent cluster plan
  ansible.builtin.set_fact:
    sno_summary_stage: cluster-definition
    sno_summary_next_action: >-
      Review the plan, then use apply mode to create the cluster and ISO.
  when:
    - sno_workflow_action == 'create'
    - automation_mode == 'plan'

- name: Summarize a target waiting for discovery
  ansible.builtin.set_fact:
    sno_summary_stage: waiting-for-target
    sno_summary_next_action: >-
      Boot the generated discovery ISO on a blank target machine.
  when:
    - sno_workflow_action == 'discover'
    - not (sno_host_discovered | default(false) | bool)

- name: Summarize pending validations
  ansible.builtin.set_fact:
    sno_summary_stage: waiting-for-validations
    sno_summary_next_action: >-
      Resolve the reported Assisted Installer validation issues.
  when:
    - sno_host_discovered | default(false) | bool
    - not (sno_installation_ready | default(false) | bool)

- name: Summarize a validated installation target
  ansible.builtin.set_fact:
    sno_summary_stage: ready-for-confirmation
    sno_summary_next_action: >-
      Review the selected disk and provide the exact ERASE confirmation
      only when the target is disposable.
  when:
    - sno_installation_disk_valid | default(false) | bool
    - not (sno_installation_started | default(false) | bool)
    - automation_mode == 'plan'

- name: Summarize an active installation
  ansible.builtin.set_fact:
    sno_summary_stage: installing
    sno_summary_next_action: >-
      Keep the target and network services running while installation
      monitoring continues.
  when: >-
    sno_workflow_action == 'monitor'
    or (sno_installation_started | default(false) | bool)

- name: Summarize Assisted Installer completion
  ansible.builtin.set_fact:
    sno_summary_stage: installed
    sno_summary_next_action: >-
      Download credentials and verify the OpenShift API.
  when: sno_installation_completed | default(false) | bool

- name: Summarize installed-cluster verification
  ansible.builtin.set_fact:
    sno_summary_stage: installed-pending-verification
    sno_summary_next_action: >-
      Use apply mode to download credentials and verify the cluster.
  when:
    - sno_workflow_action == 'verify'
    - not (sno_automation_completed | default(false) | bool)

- name: Summarize completed automation
  ansible.builtin.set_fact:
    sno_summary_stage: complete
    sno_summary_next_action: >-
      The SNO installation workflow is complete.
  when: sno_automation_completed | default(false) | bool
- name: Summarize missing DNS prerequisites
  ansible.builtin.set_fact:
    sno_summary_stage: waiting-for-dns
    sno_summary_next_action: >-
      Create or correct the required API, API-int, and wildcard
      application DNS records.
  when:
    - sno_workflow_action in ['create', 'discover']
    - not (sno_dns_ready | default(false) | bool)

- name: Summarize required manual ISO boot
  ansible.builtin.set_fact:
    sno_summary_stage: waiting-for-manual-boot
    sno_summary_next_action: >-
      Mount and boot the discovery ISO on the target, then rerun
      with manual_boot_confirmed=true.
  when:
    - sno_manual_action_required | default(false) | bool
    - sno_dns_ready | default(false) | bool

- name: Report the final workflow summary
  ansible.builtin.debug:
    msg:
      - "Cluster: {{ cluster_name }}.{{ base_dns_domain }}"
      - "Cluster ID: {{ sno_cluster_id | default('not created') }}"
      - "Assisted Installer status: {{ sno_cluster_status }}"
      - "Workflow action: {{ sno_workflow_action }}"
      - "Automation mode: {{ automation_mode }}"
      - "Current stage: {{ sno_summary_stage }}"
      - "Next action: {{ sno_summary_next_action }}"
      - >-
        Host discovered:
        {{ sno_host_discovered | default(false) }}
      - >-
        Installation ready:
        {{ sno_installation_ready | default(false) }}
      - >-
        Installation started:
        {{ sno_installation_started | default(false) }}
      - >-
        Automation complete:
        {{ sno_automation_completed | default(false) }}
      - No credential, token, password, or pull-secret content was printed.
      - "DNS ready: {{ sno_dns_ready | default('not checked') }}"
