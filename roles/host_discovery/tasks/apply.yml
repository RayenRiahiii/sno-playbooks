---
- name: Wait for exactly one connected host
  ansible.builtin.uri:
    url: >-
      {{ assisted_api_url }}/v2/infra-envs/{{ sno_infra_env_id }}/hosts
    method: GET
    headers:
      Authorization: "Bearer {{ assisted_api_token }}"
    status_code: 200
    return_content: true
    timeout: 60
  register: discovered_hosts
  changed_when: false
  failed_when: >-
    (discovered_hosts.json | default([]) | length) > 1
  until: >-
    (discovered_hosts.status | default(0) | int == 200)
    and (discovered_hosts.json is defined)
    and (discovered_hosts.json | default([]) | length == 1)
    and
    (
      discovered_hosts.json[0].status | default('disconnected')
      != 'disconnected'
    )
  retries: "{{ host_registration_retries }}"
  delay: "{{ host_registration_delay }}"
- name: Store the discovered SNO host
  ansible.builtin.set_fact:
    sno_host_discovered: true
    discovered_host: "{{ discovered_hosts.json[0] }}"
    sno_host_id: "{{ discovered_hosts.json[0].id }}"

- name: Assign the control-plane role
  ansible.builtin.uri:
    url: >-
      {{ assisted_api_url }}/v2/infra-envs/{{ sno_infra_env_id }}/hosts/{{ sno_host_id }}
    method: PATCH
    headers:
      Authorization: "Bearer {{ assisted_api_token }}"
    body_format: json
    body:
      host_role: master
    status_code:
      - 200
      - 201
    return_content: true
  register: configured_sno_host
  when: discovered_host.host_role | default('') != 'master'

- name: Parse the discovered hardware inventory
  ansible.builtin.set_fact:
    sno_host_inventory: >-
      {{
        discovered_host.inventory
        | default('{}')
        | from_json
      }}
    sno_host_validations: >-
      {{
        discovered_host.validations_info
        | default('{}')
        | from_json
      }}

- name: Report the discovered hardware
  ansible.builtin.debug:
    msg:
      - "Host ID: {{ sno_host_id }}"
      - "Host status: {{ discovered_host.status }}"
      - >-
        CPU threads:
        {{ sno_host_inventory.cpu.count | default('unknown') }}
      - >-
        RAM GiB:
        {{
          (
            (sno_host_inventory.memory.physical_bytes | default(0) | float)
            / 1073741824
          ) | round(2)
        }}
      - >-
        Detected disks:
        {{ sno_host_inventory.disks | default([]) | length }}
      - The installation disk was not selected or erased.

- name: Report the discovered disks
  ansible.builtin.debug:
    msg: >-
      {{ item.path | default(item.name | default('unknown')) }}:
      {{
        ((item.size_bytes | default(0) | float) / 1073741824)
        | round(2)
      }} GiB,
      bootable={{ item.bootable | default('unknown') }}
  loop: "{{ sno_host_inventory.disks | default([]) }}"
  loop_control:
    label: "{{ item.path | default(item.name | default('disk')) }}"
